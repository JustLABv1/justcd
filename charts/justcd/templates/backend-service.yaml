apiVersion: v1
kind: Service
metadata:
  name: {{ include "justcd.fullname" . }}-backend
  labels:
    {{- include "justcd.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- if .Values.backend.observability.metrics.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: {{ .Values.backend.service.port | quote }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "justcd.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
