apiVersion: v1
kind: Service
metadata:
  name: {{ include "justcd.fullname" . }}-frontend
  labels:
    {{- include "justcd.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "justcd.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
