{{- if .Values.docs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "justcd.fullname" . }}-docs
  labels:
    {{- include "justcd.labels" . | nindent 4 }}
    app.kubernetes.io/component: docs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.docs.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "justcd.selectorLabels" (dict "root" . "component" "docs") | nindent 4 }}
{{- end }}
