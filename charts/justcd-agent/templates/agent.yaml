{{- $name := printf "%s-justcd-agent" .Release.Name | trunc 45 | trimSuffix "-" -}}
{{- $sa := default $name .Values.serviceAccount.name -}}
{{- if not (hasPrefix "https://" .Values.serverUrl) }}{{ fail "serverUrl must use HTTPS" }}{{ end -}}
{{- if not .Values.enrollmentSecret }}{{ fail "enrollmentSecret is required" }}{{ end -}}
{{- range .Values.profiles }}{{ if not .name }}{{ fail "each profile needs a name" }}{{ end }}{{ if not .workspaceIds }}{{ fail "each profile needs explicit workspaceIds" }}{{ end }}{{ end -}}
{{- $profiles := list -}}
{{- range .Values.profiles -}}
{{- $profile := deepCopy . -}}
{{- if and $.Values.kubernetes.tokenSecret (not .tokenFile) -}}
{{- $_ := set $profile "tokenFile" "/etc/justcd-agent/kubernetes-token/token" -}}
{{- end -}}
{{- $_ := set $profile "deniedNamespaces" (concat (default (list) .deniedNamespaces) (list $.Release.Namespace "kube-system" "kube-public" "kube-node-lease") | uniq) -}}
{{- $profiles = append $profiles $profile -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  config.json: |
    {{ dict "clusterId" .Values.kubernetes.clusterId "kubernetesServerUrl" .Values.kubernetes.serverUrl "kubernetesCAFile" (ternary "/etc/justcd-agent/kubernetes-ca/ca.crt" "" (ne .Values.kubernetes.caSecret "")) "serverUrl" .Values.serverUrl "enrollmentTokenFile" "/etc/justcd-agent/enrollment/enrollmentToken" "identityFile" "/var/lib/justcd-agent/identity.json" "serverCAFile" (ternary "/etc/justcd-agent/ca/ca.crt" "" (ne .Values.serverCASecret "")) "profiles" $profiles | toJson }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
---
{{- end }}
{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/config: {{ dict "kubernetes" .Values.kubernetes "profiles" $profiles "serverUrl" .Values.serverUrl "serverCASecret" .Values.serverCASecret "enrollmentSecret" .Values.enrollmentSecret | toJson | sha256sum | quote }}
    spec:
      serviceAccountName: {{ $sa }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/justcd-agent
              readOnly: true
            - name: enrollment
              mountPath: /etc/justcd-agent/enrollment
              readOnly: true
            - name: identity
              mountPath: /var/lib/justcd-agent
            {{- if .Values.serverCASecret }}
            - name: ca
              mountPath: /etc/justcd-agent/ca
              readOnly: true
            {{- end }}
            {{- if .Values.kubernetes.caSecret }}
            - name: kubernetes-ca
              mountPath: /etc/justcd-agent/kubernetes-ca
              readOnly: true
            {{- end }}
            {{- if .Values.kubernetes.tokenSecret }}
            - name: kubernetes-token
              mountPath: /etc/justcd-agent/kubernetes-token
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: enrollment
          secret:
            secretName: {{ .Values.enrollmentSecret }}
        - name: identity
          persistentVolumeClaim:
            claimName: {{ default $name .Values.persistence.existingClaim }}
        {{- if .Values.serverCASecret }}
        - name: ca
          secret:
            secretName: {{ .Values.serverCASecret }}
        {{- end }}

        {{- if .Values.kubernetes.caSecret }}
        - name: kubernetes-ca
          secret:
            secretName: {{ .Values.kubernetes.caSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.kubernetes.tokenSecret }}
        - name: kubernetes-token
          secret:
            secretName: {{ .Values.kubernetes.tokenSecret }}
            items:
              - key: token
                path: token
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
