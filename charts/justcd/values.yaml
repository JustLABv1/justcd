nameOverride: ""
fullnameOverride: ""

# The browser-facing origin, including scheme. Also used for OIDC callbacks.
publicUrl: ""
cookieSecure: true
sessionLifetime: 12h

imagePullSecrets: []

frontend:
  # Set runAsUser/runAsGroup to null to let OpenShift SCC assign IDs.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  serviceAccountName: ""
  automountServiceAccountToken: false
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  replicaCount: 1
  image:
    repository: justcd-frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

backend:
  # Set runAsUser/runAsGroup to null to let OpenShift SCC assign IDs.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  serviceAccountName: ""
  automountServiceAccountToken: false
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  image:
    repository: justcd-backend
    tag: ""
    pullPolicy: IfNotPresent
  # Existing Secret with JUSTCD_DATABASE_URL and JUSTCD_ENCRYPTION_KEY keys.
  existingSecret: ""
  # Optional PEM CA bundle from an existing Secret in the release namespace.
  # Use tls.crt instead of ca.crt for a genuinely self-signed server certificate.
  customCA:
    existingSecret: ""
    secretKey: ca.crt
  service:
    port: 8080
  observability:
    metrics:
      enabled: false
    tracing:
      enabled: false
      endpoint: ""
      sampleRatio: 0.1
      headersSecret: ""
      headersSecretKey: OTEL_EXPORTER_OTLP_HEADERS
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: justcd.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
