{{- $existingSecret := required "Set backend.existingSecret to a Secret containing JUSTCD_DATABASE_URL and JUSTCD_ENCRYPTION_KEY" (.Values.backend.existingSecret | trim) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "justcd.fullname" . }}-backend
  labels:
    {{- include "justcd.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  # The API also runs the reconciliation worker. Avoid overlapping workers
  # while replacing the single backend pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "justcd.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "justcd.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.backend.automountServiceAccountToken }}
      {{- with .Values.backend.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.backend.customCA.existingSecret .Values.backend.extraVolumes }}
      volumes:
        {{- if .Values.backend.customCA.existingSecret }}
        - name: backend-custom-ca
          secret:
            secretName: {{ required "Set backend.customCA.existingSecret to a nonempty Secret name" (.Values.backend.customCA.existingSecret | trim) | quote }}
            items:
              - key: {{ required "Set backend.customCA.secretKey when customCA.existingSecret is set" (.Values.backend.customCA.secretKey | trim) | quote }}
                path: ca.crt
        {{- end }}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ default .Chart.AppVersion .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.backend.customCA.existingSecret .Values.backend.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.backend.customCA.existingSecret }}
            - name: backend-custom-ca
              mountPath: /etc/justcd/custom-ca
              readOnly: true
            {{- end }}
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            {{- if .Values.backend.customCA.existingSecret }}
            # Go loads these directories in addition to the system CA bundle.
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/justcd/custom-ca
            {{- end }}
            - name: JUSTCD_LISTEN_ADDRESS
              value: ":{{ .Values.backend.service.port }}"
            - name: JUSTCD_PUBLIC_URL
              value: {{ required "Set publicUrl to the browser-facing JustCD origin" .Values.publicUrl | quote }}
            - name: JUSTCD_FRONTEND_URL
              value: {{ .Values.publicUrl | quote }}
            - name: JUSTCD_COOKIE_SECURE
              value: {{ .Values.cookieSecure | quote }}
            - name: JUSTCD_SESSION_LIFETIME
              value: {{ .Values.sessionLifetime | quote }}
            - name: JUSTCD_METRICS_ENABLED
              value: {{ .Values.backend.observability.metrics.enabled | quote }}
            - name: JUSTCD_OTEL_ENABLED
              value: {{ .Values.backend.observability.tracing.enabled | quote }}
            - name: JUSTCD_OTEL_TRACE_SAMPLE_RATIO
              value: {{ .Values.backend.observability.tracing.sampleRatio | quote }}
            {{- if .Values.backend.observability.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "Set backend.observability.tracing.endpoint when tracing is enabled" .Values.backend.observability.tracing.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: justcd-backend
            {{- if .Values.backend.observability.tracing.headersSecret }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.observability.tracing.headersSecret | quote }}
                  key: {{ required "Set backend.observability.tracing.headersSecretKey when headersSecret is set" .Values.backend.observability.tracing.headersSecretKey | quote }}
            {{- end }}
            {{- end }}
            - name: JUSTCD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $existingSecret | quote }}
                  key: JUSTCD_DATABASE_URL
            - name: JUSTCD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $existingSecret | quote }}
                  key: JUSTCD_ENCRYPTION_KEY
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
