name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v0.1.0, got $RELEASE_TAG" >&2
            exit 1
          fi

  images:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./services/frontend
            file: ./services/frontend/Dockerfile
          - service: backend
            context: ./services/backend
            file: ./services/backend/Dockerfile
          - service: docs
            context: ./services/docs
            file: ./services/docs/Dockerfile
          - service: agent
            context: ./services/backend
            file: ./services/backend/Dockerfile.agent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          pull: true
          no-cache-filters: runtime
          tags: |
            ghcr.io/justlabv1/justcd:${{ matrix.service }}
            ghcr.io/justlabv1/justcd:${{ matrix.service }}-${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record all ${{ matrix.service }} vulnerability findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/justlabv1/justcd:${{ matrix.service }}-${{ github.ref_name }}
          scanners: vuln
          format: json
          output: trivy-${{ matrix.service }}.json
          exit-code: '0'
      - name: Keep vulnerability report
        uses: actions/upload-artifact@v7
        with:
          name: vulnerabilities-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.json
          retention-days: 14
      - name: Block fixable HIGH/CRITICAL findings before publishing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ghcr.io/justlabv1/justcd:${{ matrix.service }}-${{ github.ref_name }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish scanned ${{ matrix.service }}
        env:
          IMAGE: ghcr.io/justlabv1/justcd:${{ matrix.service }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker push "$IMAGE-$RELEASE_TAG"
          docker push "$IMAGE"

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
