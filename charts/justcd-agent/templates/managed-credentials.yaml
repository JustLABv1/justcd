{{- $name := printf "%s-justcd-agent" .Release.Name | trunc 45 | trimSuffix "-" -}}
{{- $sa := default $name .Values.serviceAccount.name -}}
{{- $seen := dict -}}
{{- range .Values.profiles -}}
{{- if .deploymentCredentials -}}
{{- if or .clusterScope $.Values.rbac.clusterWide }}{{ fail "managed deployment credentials cannot use cluster scope or cluster-wide agent RBAC" }}{{ end -}}
{{- if or (ne (len .workspaceIds) 1) (not .namespaces) }}{{ fail "managed deployment credentials require one workspace and prepared namespaces" }}{{ end -}}
{{- $lifetime := int .deploymentCredentials.lifetimeSeconds -}}
{{- if or (lt $lifetime 600) (gt $lifetime 3600) }}{{ fail "managed credential lifetimeSeconds must be 600–3600" }}{{ end -}}
{{- if not $.Values.managedCredentials.deploymentClusterRole -}}
{{- range $.Values.managedCredentials.rules -}}
{{- range .apiGroups -}}
{{- if has . (list "*" "rbac.authorization.k8s.io" "authentication.k8s.io" "authorization.k8s.io") }}{{ fail "managed deployment rules cannot grant wildcard or authorization APIs" }}{{ end -}}
{{- end -}}
{{- range .resources -}}
{{- if has . (list "*" "serviceaccounts" "serviceaccounts/token" "namespaces" "nodes" "roles" "rolebindings" "clusterroles" "clusterrolebindings") }}{{ fail "managed deployment rules cannot grant identity, RBAC or provisioning resources" }}{{ end -}}
{{- end -}}
{{- range .verbs -}}
{{- if has . (list "*" "bind" "escalate" "impersonate") }}{{ fail "managed deployment rules cannot grant wildcard or escalation verbs" }}{{ end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .deploymentCredentials.provisioning -}}
{{- if ne (len $.Values.profiles) 1 }}{{ fail "automatic provisioning requires a dedicated single-profile agent" }}{{ end -}}
{{- if not .deploymentCredentials.provisioning.deploymentClusterRole }}{{ fail "automatic provisioning requires an administrator-approved deploymentClusterRole" }}{{ end -}}
{{- else -}}
{{- range .namespaces -}}
{{- $ns := . -}}
{{- range $.Values.profiles }}
{{- if .clusterScope }}{{ fail "managed deployment credentials cannot coexist with a cluster-scope profile" }}{{ end -}}
{{- if not .deploymentCredentials }}{{- range .namespaces }}
{{- if or (eq . $ns) (eq . "*") (and (hasSuffix "-*" .) (hasPrefix (trimSuffix "*" .) $ns)) }}{{ fail "managed namespaces cannot overlap static credential profiles" }}{{ end -}}
{{- end }}{{- end }}{{- end -}}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $ns)) (gt (len $ns) 63) (has $ns (list "default" "kube-system" "kube-public" "kube-node-lease" $.Release.Namespace)) }}{{ fail "managed credentials require exact, unprotected namespace names" }}{{ end -}}
{{- if hasKey $seen $ns }}{{ fail "managed namespaces cannot be shared across profiles" }}{{ end -}}
{{- $_ := set $seen $ns true -}}
{{- if $.Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: justcd-deployer
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
{{- if not $.Values.managedCredentials.deploymentClusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-deployment
  namespace: {{ $ns }}
rules:
  {{- toYaml $.Values.managedCredentials.rules | nindent 2 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-deployment
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "ClusterRole" "Role" (ne $.Values.managedCredentials.deploymentClusterRole "") }}
  name: {{ default (printf "%s-deployment" $name) $.Values.managedCredentials.deploymentClusterRole }}
subjects:
  - kind: ServiceAccount
    name: justcd-deployer
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-issuer
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [justcd-deployer]
    verbs: [create]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [justcd-deployer]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-issuer
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-issuer
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- end }}
