name: Integration workflows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build backend and run Expat upstream tests
        run: docker build --pull -t justcd-backend:local -f services/backend/Dockerfile services/backend
      - name: Check process reaping, shutdown signals, patched library and Git HTTP clone
        run: sh scripts/check-backend-runtime.sh docker justcd-backend:local
      - name: Build frontend for Compose installation
        run: docker build --pull -t justcd-frontend:local -f services/frontend/Dockerfile services/frontend
      - name: Check Compose startup and database persistence
        run: bash scripts/check-compose.sh

  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum
      - name: Check backend Go vulnerabilities
        working-directory: services/backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Check runtime tool Go vulnerabilities
        working-directory: services/backend/tools
        run: '"$(go env GOPATH)/bin/govulncheck" helm.sh/helm/v4/cmd/helm sigs.k8s.io/kustomize/kustomize/v5'
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run migration and Kubernetes workflows
        run: bash scripts/integration.sh full
      - name: Keep failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-diagnostics
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
