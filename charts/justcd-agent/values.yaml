image:
  repository: ghcr.io/justlabv1/justcd
  tag: "agent"
  pullPolicy: IfNotPresent
serverUrl: ""
# Optional existing Secret containing ca.crt for a private JustCD HTTPS CA.
serverCASecret: ""
# Existing Secret containing the one-use enrollmentToken. Never put it in values.
enrollmentSecret: ""
# Optional existing Secrets for Kubernetes API access, separate from JustCD TLS.
kubernetes:
  clusterId: "" # Stable operator-assigned ID; skips kube-system identity lookup.
  serverUrl: "" # Optional HTTPS KubeAPI endpoint; defaults to in-cluster discovery.
  caSecret: "" # Key: ca.crt
  tokenSecret: "" # Key: token; used by profiles without an explicit tokenFile
profiles:
  - name: default
    workspaceIds: []
    namespaces: []
    clusterScope: false
persistence:
  existingClaim: ""
  size: 1Gi
  storageClass: ""
rbac:
  create: true
  # Explicit opt-in, needed for dynamically created preview namespaces and
  # cluster-scoped workloads. The API's local profile checks still apply.
  clusterWide: false
  rules:
    - apiGroups: [""]
      resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
      verbs: ["get", "list", "create", "update", "patch", "delete"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      verbs: ["get", "list", "create", "update", "patch", "delete"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "create", "update", "patch", "delete"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies"]
      verbs: ["get", "list", "create", "update", "patch", "delete"]
serviceAccount:
  create: true
  name: ""
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

imagePullSecrets: []
# For HTTP_PROXY/HTTPS_PROXY/NO_PROXY, use standard Kubernetes env entries.
extraEnv: []
# Optional mounts for operator-provided profile tokenFile paths.
extraVolumes: []
extraVolumeMounts: []

# Override individual fields, or set a field to null to omit it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Kubernetes >=1.30. Protects Pods in locally authorized namespaces, including
# controller-created Pods. Namespaces must enforce Pod Security restricted/latest.
workloadPolicy:
  enabled: true
  allowedServiceAccounts: ["default"]
  # Explicitly authorize existing Secret references, never the agent identity Secret.
  allowedSecrets: []
