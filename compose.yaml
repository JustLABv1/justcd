name: justcd

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: justcd
      POSTGRES_USER: justcd
      POSTGRES_PASSWORD: ${JUSTCD_POSTGRES_PASSWORD:?Set JUSTCD_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/justlabv1/justcd:backend${JUSTCD_IMAGE_TAG_SUFFIX:-}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JUSTCD_DATABASE_URL: postgres://justcd:${JUSTCD_POSTGRES_PASSWORD:?Set JUSTCD_POSTGRES_PASSWORD in .env}@postgres:5432/justcd?sslmode=disable
      JUSTCD_ENV: ${JUSTCD_ENV:-development}
      JUSTCD_ENCRYPTION_KEY: ${JUSTCD_ENCRYPTION_KEY:?Set JUSTCD_ENCRYPTION_KEY in .env}
      JUSTCD_LISTEN_ADDRESS: ":8080"
      JUSTCD_PUBLIC_URL: ${JUSTCD_PUBLIC_URL:-http://localhost:3000}
      JUSTCD_FRONTEND_URL: ${JUSTCD_PUBLIC_URL:-http://localhost:3000}
      JUSTCD_COOKIE_SECURE: ${JUSTCD_COOKIE_SECURE:-false}
      JUSTCD_SESSION_LIFETIME: ${JUSTCD_SESSION_LIFETIME:-12h}
      JUSTCD_SHUTDOWN_GRACE_PERIOD: 30s
    # Leave time for worker cancellation and cleanup after the 30s grace period.
    stop_grace_period: 1m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *logging

  frontend:
    image: ghcr.io/justlabv1/justcd:frontend${JUSTCD_IMAGE_TAG_SUFFIX:-}
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      JUSTCD_ENV: ${JUSTCD_ENV:-development}
      JUSTCD_API_URL: http://backend:8080
      JUSTCD_DOCS_URL: ${JUSTCD_DOCS_URL:-http://localhost:3001}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${JUSTCD_BIND_ADDRESS:-127.0.0.1}:${JUSTCD_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/healthz', r => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *logging

  docs:
    profiles: [docs]
    image: ghcr.io/justlabv1/justcd:docs${JUSTCD_IMAGE_TAG_SUFFIX:-}
    restart: unless-stopped
    init: true
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${JUSTCD_DOCS_BIND_ADDRESS:-127.0.0.1}:${JUSTCD_DOCS_PORT:-3001}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/healthz', r => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *logging

volumes:
  postgres-data:
