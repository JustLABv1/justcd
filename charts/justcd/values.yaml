nameOverride: ""
fullnameOverride: ""

# The browser-facing origin, including scheme. Also used for OIDC callbacks.
publicUrl: ""
cookieSecure: true
sessionLifetime: 12h

imagePullSecrets: []

frontend:
  replicaCount: 1
  image:
    repository: justcd-frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

backend:
  image:
    repository: justcd-backend
    tag: ""
    pullPolicy: IfNotPresent
  # Existing Secret with JUSTCD_DATABASE_URL and JUSTCD_ENCRYPTION_KEY keys.
  existingSecret: ""
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: justcd.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
